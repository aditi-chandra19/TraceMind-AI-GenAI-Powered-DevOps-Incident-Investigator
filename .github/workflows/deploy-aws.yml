name: Publish images and deploy to AWS EKS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize the image namespace
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/tracemind-api:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/tracemind-api:main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: VITE_API_URL=/api
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/tracemind-web:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/tracemind-web:main

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.AWS_EKS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Normalize the image namespace
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: azure/setup-kubectl@v4
      - name: Configure EKS access
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"
      - name: Apply Kubernetes resources
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/config.yaml -f k8s/api.yaml -f k8s/web.yaml -f k8s/ingress.yaml -f k8s/api-autoscaling.yaml
      - name: Point workloads at this commit's images
        run: |
          kubectl -n tracemind set image deployment/tracemind-api api=ghcr.io/${{ steps.image.outputs.owner }}/tracemind-api:${{ github.sha }}
          kubectl -n tracemind set image deployment/tracemind-web web=ghcr.io/${{ steps.image.outputs.owner }}/tracemind-web:${{ github.sha }}
      - name: Wait for rollout
        run: |
          kubectl -n tracemind rollout status deployment/tracemind-api --timeout=5m
          kubectl -n tracemind rollout status deployment/tracemind-web --timeout=5m
