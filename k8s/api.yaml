apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracemind-api
  namespace: tracemind
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tracemind-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: tracemind-api
    spec:
      serviceAccountName: tracemind-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/OWNER/tracemind-api:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: tracemind-config
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: tracemind-secrets
                  key: mongodb-uri
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tracemind-secrets
                  key: jwt-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tracemind-secrets
                  key: openai-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: tracemind-api
  namespace: tracemind
spec:
  selector:
    app: tracemind-api
  ports:
    - name: http
      port: 4000
      targetPort: http
